# ==============================================================================
# JanSahay AI — Netlify Production Deployment Configuration
# Web App: https://creative-mochi-5f7e5c.netlify.app/
# ==============================================================================

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL in Netlify Site Settings -> Environment Variables
  # e.g., VITE_API_URL = "https://jansahay-backend.onrender.com/api"
  # Optional cookie-free Plausible analytics:
  # VITE_PLAUSIBLE_DOMAIN = "jansahay.netlify.app"

# SPA Single Page Application catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
